name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || '' }}
  cancel-in-progress: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GitHub Release exists
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag }}
          name: BetterGravity ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag }}
          draft: false
          prerelease: false
      - name: Purge legacy bulky Electron assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag }}
        run: |
          for asset in \
            "BetterGravity-Installer-2.0.0-amd64.deb" \
            "BetterGravity-Installer-2.0.0-arm64.dmg" \
            "BetterGravity-Installer-2.0.0-arm64.zip" \
            "BetterGravity-Installer-2.0.0-x64.dmg" \
            "BetterGravity-Installer-2.0.0-x64.tar.gz" \
            "BetterGravity-Installer-2.0.0-x64.zip" \
            "BetterGravity-Installer-2.0.0-x86_64.AppImage" \
            "BetterGravity-Installer-2.0.0.exe"; do
            gh release delete-asset "$TAG" "$asset" -y --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          done

  publish-native-installers:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: native-windows
            build: pnpm build:installer:native:win
            files: |
              dist-native/*.exe
              dist-native/*.zip
          - os: macos-latest
            name: native-macos
            build: pnpm build:installer:native:mac
            files: |
              dist-native/*.dmg
              dist-native/*.zip
          - os: ubuntu-latest
            name: native-linux
            build: pnpm build:installer:native:linux
            files: dist-native/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup .NET (Windows only)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - run: pnpm install --frozen-lockfile
      - name: Build native installer
        shell: bash
        run: |
          set -e
          ${{ matrix.build }} 2>&1 | tee build.log || {
            BUILD_STATUS=$?
            echo "::error title=Native build failure on ${{ matrix.name }}::$(tail -n 25 build.log | tr '\r\n' ' ')"
            tail -n 50 build.log
            exit $BUILD_STATUS
          }
      - name: Attach native installers to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
