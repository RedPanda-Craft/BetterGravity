name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows and macOS are primary runtime platforms; Linux is the fast signal.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set display resolution on Windows
        if: runner.os == 'Windows'
        run: |
          try {
            if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
              Set-DisplayResolution -Width 1920 -Height 1080 -Force
            }
          } catch {
            Write-Warning "Could not set display resolution: $_"
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Write-Host "Display resolution: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width)x$([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)"
          } catch {}
        shell: powershell
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package:
    # Proves packaged installers build on their target platforms.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: installer-windows
            build: pnpm build:installer:win
            path: release*/*.exe
          - os: macos-latest
            name: installer-macos
            build: pnpm build:installer:mac
            path: release*/*
          - os: ubuntu-latest
            name: installer-linux
            build: pnpm build:installer:linux
            path: release*/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - name: Build packages
        shell: bash
        run: |
          set -e
          ${{ matrix.build }} 2>&1 | tee build.log || {
            BUILD_STATUS=$?
            echo "::error title=Build failure on ${{ matrix.name }}::$(tail -n 25 build.log | tr '\r\n' ' ')"
            tail -n 50 build.log
            exit $BUILD_STATUS
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          # Matches directories.output in apps/installer/package.json. Kept as a
          # glob so the two cannot silently disagree again; if-no-files-found
          # turns any future mismatch into a failure rather than a silent skip.
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  package-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: native-installer-windows
            build: pnpm build:installer:native:win
            path: dist-native/*
          - os: macos-latest
            name: native-installer-macos
            build: pnpm build:installer:native:mac
            path: |
              dist-native/*.dmg
              dist-native/*.zip
          - os: ubuntu-latest
            name: native-installer-linux
            build: pnpm build:installer:native:linux
            path: dist-native/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup .NET (Windows only)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - run: pnpm install --frozen-lockfile
      - name: Build native installer
        shell: bash
        run: |
          set -e
          ${{ matrix.build }} 2>&1 | tee build.log || {
            BUILD_STATUS=$?
            echo "::error title=Native build failure on ${{ matrix.name }}::$(tail -n 25 build.log | tr '\r\n' ' ')"
            tail -n 50 build.log
            exit $BUILD_STATUS
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
